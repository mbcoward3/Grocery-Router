# Grocery items whose names look alike, and how each pair is classified. corpus-audit fails
# when a look-alike pair is missing here, so a new recipe cannot quietly add "Yellow Onion"
# beside "Onion" unclassified.
#
# decision:
#   alias      the same product; the two items should become one.
#   group      different products a household may choose to combine on its list (group names
#              the substitution group; see SUBSTITUTIONS_SPEC.md). Combining is the household's
#              choice, asked when both appear in one week; nothing combines by default.
#   distinct   different products that are never combined.
#   undecided  not yet classified. The audit passes but lists these.
#
# Classified by the agent, following the catalog rule: alias only for clearly the same product,
# because a wrong alias silently merges products; a wrong group costs one question. Edit any
# classification that is wrong.
pairs:
  # Same product.
  - {items: [kosher-salt, salt], decision: alias, note: "Catalog spec default: one presence-only salt."}
  - {items: [mustard, yellow-mustard], decision: alias, note: "Plain mustard in US recipes is yellow mustard."}

  # Substitution groups.
  - {items: [onion, yellow-onion], decision: group, group: onions}
  - {items: [onion, white-onion], decision: group, group: onions}
  - {items: [onion, red-onion], decision: group, group: onions}
  - {items: [dill-pickle-slices, dill-pickles], decision: group, group: dill-pickles}
  - {items: [pepperoncini, sliced-pepperoncini], decision: group, group: pepperoncini}
  - {items: [ground-mild-italian-sausage, italian-sausage], decision: group, group: italian-sausage}
  - {items: [shredded-cheddar-cheese, shredded-cheese], decision: group, group: shredded-cheese}
  - {items: [shredded-cheese, shredded-italian-cheese-blend], decision: group, group: shredded-cheese}
  - {items: [shredded-cheese, shredded-mexican-cheese-blend], decision: group, group: shredded-cheese}
  - {items: [reduced-sodium-soy-sauce, soy-sauce], decision: group, group: soy-sauce}
  - {items: [butter, unsalted-butter], decision: group, group: butter}
  - {items: [ground-beef, lean-ground-beef], decision: group, group: ground-beef}
  - {items: [85-percent-lean-ground-beef, ground-beef], decision: group, group: ground-beef}
  - {items: [85-percent-lean-ground-beef, lean-ground-beef], decision: group, group: ground-beef}
  - {items: [90-percent-lean-ground-beef, ground-beef], decision: group, group: ground-beef}
  - {items: [90-percent-lean-ground-beef, lean-ground-beef], decision: group, group: ground-beef}
  - {items: [potatoes, russet-potatoes], decision: group, group: potatoes}
  - {items: [potatoes, yukon-gold-potatoes], decision: group, group: potatoes}
  - {items: [baby-yukon-potatoes, potatoes], decision: group, group: potatoes}

  # Different products.
  - {items: [butter, garlic-butter], decision: distinct}
  - {items: [carrots, frozen-peas-and-carrots], decision: distinct}
  - {items: [celery, celery-seed], decision: distinct}
  - {items: [coconut-milk, milk], decision: distinct}
  - {items: [garlic, garlic-butter], decision: distinct}
  - {items: [garlic, garlic-powder], decision: distinct}
  - {items: [garlic, garlic-salt], decision: distinct}
  - {items: [garlic-salt, salt], decision: distinct}
  - {items: [green-onion, onion], decision: distinct}
  - {items: [lemon, lemon-juice], decision: distinct}
  - {items: [onion, onion-powder], decision: distinct}
  - {items: [onion, onion-soup-mix], decision: distinct}
  - {items: [petite-diced-tomatoes, tomato], decision: distinct}
  - {items: [rotel-tomatoes-and-chiles, tomato], decision: distinct}
  - {items: [tomato, tomato-paste], decision: distinct}
  - {items: [tomato, tomato-sauce], decision: distinct}
