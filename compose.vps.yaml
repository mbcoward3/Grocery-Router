name: grocery-router

x-app-runtime: &app-runtime
  image: "${GROCERY_ROUTER_IMAGE:?Set GROCERY_ROUTER_IMAGE to the published GHCR tag@sha256 digest}"
  pull_policy: always
  environment:
    APP_ENV: production
    GROCERY_ROUTER_STORAGE: database
    DATABASE_URL_FILE: /run/secrets/database_url
  secrets:
    - database_url
  init: true
  read_only: true
  user: "${GROCERY_ROUTER_RUNTIME_UID:?Set this to the VPS operator uid}:${GROCERY_ROUTER_RUNTIME_GID:?Set this to the VPS operator gid}"
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:size=32m,mode=1777
  networks:
    - private
  pids_limit: 128

services:
  app:
    <<: *app-runtime
    expose:
      - "8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health/ready', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 3
    cpus: 0.75
    mem_limit: 384m
    mem_reservation: 64m
    stop_grace_period: 15s

  migrate:
    <<: *app-runtime
    profiles:
      - operations
    command: ["python", "-m", "gr.migrate", "--root", "/app"]
    restart: "no"
    cpus: 0.5
    mem_limit: 256m

  caddy:
    image: caddy:2.10.0-alpine@sha256:ae4458638da8e1a91aafffb231c5f8778e964bca650c8a8cb23a7e8ac557aa3c
    environment:
      GROCERY_ROUTER_DOMAIN: "${GROCERY_ROUTER_DOMAIN:?Set the DNS name that points to this VPS}"
      GROCERY_ROUTER_ACME_EMAIL: "${GROCERY_ROUTER_ACME_EMAIL:?Set the ACME operator email}"
    ports:
      - "80:8080"
      - "443:8443"
      - "443:8443/udp"
    volumes:
      - ./deploy/compose/Caddyfile:/etc/caddy/Caddyfile:ro
      - "${GROCERY_ROUTER_AUTH_CADDYFILE:-./deploy/compose/auth-deny.caddy}:/etc/caddy/auth.caddy:ro"
      - ./.local/caddy/data:/data
      - ./.local/caddy/config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    user: "${GROCERY_ROUTER_RUNTIME_UID:?Set this to the VPS operator uid}:${GROCERY_ROUTER_RUNTIME_GID:?Set this to the VPS operator gid}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - private
    cpus: 0.5
    mem_limit: 256m
    mem_reservation: 32m
    pids_limit: 128
    stop_grace_period: 15s

networks:
  private:
    driver: bridge

secrets:
  database_url:
    file: "${GROCERY_ROUTER_DATABASE_URL_FILE:?Set the path to the owner-readable CockroachDB URL file}"
