apiVersion: apps/v1
kind: Deployment
metadata:
  name: grocery-router
  labels:
    app.kubernetes.io/name: grocery-router
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: grocery-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grocery-router
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: grocery-router:unconfigured
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "gr.migrate", "--root", "/app"]
          envFrom:
            - configMapRef:
                name: grocery-router-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: grocery-router-secrets
                  key: database-url
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: app
          image: grocery-router:unconfigured
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8765
              protocol: TCP
          envFrom:
            - configMapRef:
                name: grocery-router-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: grocery-router-secrets
                  key: database-url
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
