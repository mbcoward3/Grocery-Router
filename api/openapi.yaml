openapi: 3.1.0
info:
  title: Grocery Router API
  version: 0.2.0
  description: Authenticated household API for Grocery Router.
servers:
  - url: /api/v2
paths:
  /session:
    get:
      operationId: getSession
      summary: Return the current application user and household memberships.
      responses:
        "200":
          description: Current session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current application session.
      responses:
        "204": { description: Session revoked. }
        "403": { $ref: "#/components/responses/Forbidden" }
  /households/{householdID}/recipes:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      operationId: listRecipes
      summary: List every verified recipe eligible for selection.
      responses:
        "200":
          description: Verified recipes ordered by name.
          content:
            application/json:
              schema:
                type: object
                required: [recipes]
                properties:
                  recipes:
                    type: array
                    items: { $ref: "#/components/schemas/RecipeSummary" }
        "500": { $ref: "#/components/responses/InternalError" }
  /households/{householdID}/recipes/{recipeID}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - name: recipeID
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getRecipe
      summary: Fetch one complete verified recipe.
      responses:
        "200":
          description: Complete read-only recipe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecipeDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /households/{householdID}/week/current:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      operationId: getCurrentWeek
      summary: Return the explicitly generated current week.
      responses:
        "200": { $ref: "#/components/responses/Week" }
        "404": { $ref: "#/components/responses/NoCurrentWeek" }
  /households/{householdID}/weeks/history:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      operationId: listWeekHistory
      summary: List earlier generated weeks, newest first.
      responses:
        "200":
          description: Read-only past-week summaries.
          content:
            application/json:
              schema:
                type: object
                required: [weeks]
                properties:
                  weeks:
                    type: array
                    items: { $ref: "#/components/schemas/WeekHistorySummary" }
        "500": { $ref: "#/components/responses/InternalError" }
  /households/{householdID}/weeks/history/{weekID}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - name: weekID
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getHistoricalWeek
      summary: Return an earlier week's final meals and retained grocery checklist.
      responses:
        "200":
          description: Read-only historical week detail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoricalWeek" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
  /households/{householdID}/week/current/generate:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    post:
      operationId: generateCurrentWeek
      summary: Create or fully regenerate the current week.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [recipeCount]
              properties:
                recipeCount:
                  type: integer
                  minimum: 1
      responses:
        "200": { $ref: "#/components/responses/Week" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "422": { $ref: "#/components/responses/WeekOperationFailed" }
  /households/{householdID}/week/current/recipes:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    post:
      operationId: addCurrentWeekRecipe
      summary: Append a specific verified recipe occurrence.
      requestBody:
        $ref: "#/components/requestBodies/RecipeSelection"
      responses:
        "200": { $ref: "#/components/responses/Week" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NoCurrentWeek" }
        "422": { $ref: "#/components/responses/WeekOperationFailed" }
  /households/{householdID}/week/current/recipes/{occurrenceID}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/OccurrenceID"
    delete:
      operationId: removeCurrentWeekRecipe
      summary: Remove one recipe occurrence.
      responses:
        "200": { $ref: "#/components/responses/Week" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/OccurrenceNotFound" }
        "422": { $ref: "#/components/responses/WeekOperationFailed" }
    put:
      operationId: swapCurrentWeekRecipe
      summary: Replace one occurrence with a specific verified recipe.
      requestBody:
        $ref: "#/components/requestBodies/RecipeSelection"
      responses:
        "200": { $ref: "#/components/responses/Week" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/OccurrenceNotFound" }
        "422": { $ref: "#/components/responses/WeekOperationFailed" }
  /households/{householdID}/week/current/recipes/{occurrenceID}/random-swap:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - $ref: "#/components/parameters/OccurrenceID"
    post:
      operationId: randomSwapCurrentWeekRecipe
      summary: Replace one occurrence with a random eligible recipe.
      responses:
        "200": { $ref: "#/components/responses/Week" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/OccurrenceNotFound" }
        "422": { $ref: "#/components/responses/WeekOperationFailed" }
  /households/{householdID}/week/current/groceries:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
    get:
      operationId: getCurrentGroceries
      summary: Return the current grouped grocery checklist.
      responses:
        "200": { $ref: "#/components/responses/Groceries" }
        "404": { $ref: "#/components/responses/NoCurrentWeek" }
    post:
      operationId: addCurrentGroceryLine
      summary: Add a manual presence-only line to Other.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties: { name: { type: string, minLength: 1 } }
      responses:
        "200": { $ref: "#/components/responses/Groceries" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "404": { $ref: "#/components/responses/NoCurrentWeek" }
  /households/{householdID}/week/current/groceries/{lineID}:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - name: lineID
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    patch:
      operationId: updateCurrentGroceryLine
      summary: Toggle completion or set a week-only quantity override.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [completed]
                  properties: { completed: { type: boolean } }
                - type: object
                  additionalProperties: false
                  required: [overrideText]
                  properties: { overrideText: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Groceries" }
        "400": { $ref: "#/components/responses/InvalidRequest" }
        "422": { $ref: "#/components/responses/WeekOperationFailed" }
    delete:
      operationId: removeCurrentGroceryLine
      summary: Remove a line from this week's visible checklist.
      responses:
        "200": { $ref: "#/components/responses/Groceries" }
        "422": { $ref: "#/components/responses/WeekOperationFailed" }
  /households/{householdID}/week/current/groceries/{lineID}/contributions:
    parameters:
      - $ref: "#/components/parameters/HouseholdID"
      - name: lineID
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getCurrentGroceryLineContributions
      summary: Return recipe provenance for one generated line.
      responses:
        "200":
          description: Recipe contribution traces.
          content:
            application/json:
              schema:
                type: object
                required: [contributions]
                properties:
                  contributions:
                    type: array
                    items: { $ref: "#/components/schemas/GroceryContribution" }
        "422": { $ref: "#/components/responses/WeekOperationFailed" }
components:
  parameters:
    HouseholdID:
      name: householdID
      in: path
      required: true
      schema: { type: string, format: uuid }
    OccurrenceID:
      name: occurrenceID
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
  requestBodies:
    RecipeSelection:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [recipeId]
            properties:
              recipeId:
                type: integer
                minimum: 1
  schemas:
    SessionUser:
      type: object
      required: [id, email, displayName, avatarUrl]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        avatarUrl: { type: [string, "null"], format: uri }
    HouseholdMembership:
      type: object
      required: [householdID, householdName, role]
      properties:
        householdID: { type: string, format: uuid }
        householdName: { type: string }
        role: { type: string, enum: [owner, admin, member] }
    Session:
      type: object
      required: [user, households]
      properties:
        user: { $ref: "#/components/schemas/SessionUser" }
        households:
          type: array
          items: { $ref: "#/components/schemas/HouseholdMembership" }
    DurationRange:
      type: object
      required: [minimumMinutes, maximumMinutes]
      properties:
        minimumMinutes:
          type: [integer, "null"]
          minimum: 0
        maximumMinutes:
          type: [integer, "null"]
          minimum: 0
    RecipeSummary:
      type: object
      required: [id, key, name, imageUrl, yield, handsOn, unattended]
      properties:
        id: { type: integer }
        key: { type: string }
        name: { type: string }
        imageUrl: { type: [string, "null"], format: uri }
        yield: { type: [string, "null"] }
        handsOn: { $ref: "#/components/schemas/DurationRange" }
        unattended: { $ref: "#/components/schemas/DurationRange" }
    RecipeSource:
      type: object
      required: [relationship, attribution, url, primary]
      properties:
        relationship: { type: string, enum: [source, adapted-from] }
        attribution: { type: string }
        url: { type: [string, "null"] }
        primary: { type: boolean }
    RecipeIngredient:
      type: object
      required: [id, sourceText, preparation, optional, displayNote, shoppingItem]
      properties:
        id: { type: integer }
        sourceText: { type: string }
        preparation: { type: [string, "null"] }
        optional: { type: boolean }
        displayNote: { type: [string, "null"] }
        shoppingItem: { type: [string, "null"] }
    RecipeIngredientSection:
      type: object
      required: [name, ingredients]
      properties:
        name: { type: string }
        ingredients:
          type: array
          items: { $ref: "#/components/schemas/RecipeIngredient" }
    RecipeStep:
      type: object
      required: [id, instruction]
      properties:
        id: { type: integer }
        instruction: { type: string }
    RecipeInstructionSection:
      type: object
      required: [name, steps]
      properties:
        name: { type: string }
        steps:
          type: array
          items: { $ref: "#/components/schemas/RecipeStep" }
    RecipeDetail:
      allOf:
        - { $ref: "#/components/schemas/RecipeSummary" }
        - type: object
          required: [sources, ingredientSections, instructionSections]
          properties:
            sources:
              type: array
              items: { $ref: "#/components/schemas/RecipeSource" }
            ingredientSections:
              type: array
              items: { $ref: "#/components/schemas/RecipeIngredientSection" }
            instructionSections:
              type: array
              items: { $ref: "#/components/schemas/RecipeInstructionSection" }
    GroceryLine:
      type: object
      required: [id, section, name, quantity, generatedQuantity, origin, optional, removed, completed, hasContributions]
      properties:
        id: { type: integer }
        section: { type: string }
        name: { type: string }
        quantity: { type: [string, "null"] }
        generatedQuantity: { type: [string, "null"] }
        origin: { type: string, enum: [generated, manual] }
        optional: { type: boolean }
        removed: { type: boolean }
        completed: { type: boolean }
        hasContributions: { type: boolean }
    Groceries:
      type: object
      required: [startsOn, lines]
      properties:
        startsOn: { type: string, format: date }
        lines:
          type: array
          items: { $ref: "#/components/schemas/GroceryLine" }
    GroceryContribution:
      type: object
      required: [recipeId, recipeName, sourceText, quantity, preparation, optional]
      properties:
        recipeId: { type: integer }
        recipeName: { type: string }
        sourceText: { type: string }
        quantity: { type: [string, "null"] }
        preparation: { type: [string, "null"] }
        optional: { type: boolean }
    RecipeOccurrence:
      type: object
      required: [id, position, recipe]
      properties:
        id: { type: integer }
        position: { type: integer, minimum: 0 }
        recipe: { $ref: "#/components/schemas/RecipeSummary" }
    Week:
      type: object
      required: [id, startsOn, recipes]
      properties:
        id: { type: integer }
        startsOn: { type: string, format: date }
        recipes:
          type: array
          items: { $ref: "#/components/schemas/RecipeOccurrence" }
    WeekHistorySummary:
      type: object
      required: [id, startsOn, recipeCount, groceryCount, completedCount]
      properties:
        id: { type: integer }
        startsOn: { type: string, format: date }
        recipeCount: { type: integer, minimum: 0 }
        groceryCount: { type: integer, minimum: 0 }
        completedCount: { type: integer, minimum: 0 }
    HistoricalWeek:
      type: object
      required: [week, groceries]
      properties:
        week: { $ref: "#/components/schemas/Week" }
        groceries: { $ref: "#/components/schemas/Groceries" }
    APIError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    Unauthenticated:
      description: A valid application session is required.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/APIError" }
    Forbidden:
      description: The request origin or household access was denied.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/APIError" }
    Week:
      description: Canonical current week after the operation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Week" }
    InvalidRequest:
      description: The path or JSON request was invalid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/APIError" }
    NoCurrentWeek:
      description: The current week has not been explicitly generated.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/APIError" }
    OccurrenceNotFound:
      description: The occurrence is not part of the current week.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/APIError" }
    WeekOperationFailed:
      description: The requested week mutation could not be completed atomically.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/APIError" }
    Groceries:
      description: Canonical current grocery checklist.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Groceries" }
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/APIError" }
    InternalError:
      description: The request could not be completed.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/APIError" }
