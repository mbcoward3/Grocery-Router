version: "3"

vars:
  GOLANGCI_LINT_VERSION: v2.12.2
  GOLANGCI_LINT: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
  SQLFLUFF_VERSION: 3.5.0
  SQLFLUFF: uvx --from sqlfluff=={{.SQLFLUFF_VERSION}} sqlfluff

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  format:
    desc: Format Go source and imports
    cmds:
      - '{{.GOLANGCI_LINT}} fmt'

  generate:
    desc: Regenerate typed sqlc queries
    cmds:
      - go tool sqlc generate

  test:
    desc: Run all Go tests
    cmds:
      - go test ./...

  lint:
    desc: Run all pinned linters
    deps: [go-lint, sql-lint]

  go-lint:
    desc: Run the pinned Go lint policy and formatting checks
    cmds:
      - '{{.GOLANGCI_LINT}} run'

  sql-lint:
    desc: Lint migrations and sqlc query sources with SQLFluff
    cmds:
      - '{{.SQLFLUFF}} lint internal/database/migrations internal/store/queries'

  ci:
    desc: Run the checks enforced in CI
    deps: [lint, test, web-ci]

  web-install:
    desc: Install the locked frontend dependencies
    cmds:
      - npm ci --prefix web

  web-dev:
    desc: Start the Vite development server
    cmds:
      - npm run dev --prefix web

  db-up:
    desc: Start the local PostgreSQL database
    cmds:
      - docker compose up -d --wait postgres

  db-down:
    desc: Stop the local PostgreSQL database
    cmds:
      - docker compose down

  dev:
    desc: Bootstrap and start the complete local application
    cmds:
      - bash scripts/dev.sh

  web-generate:
    desc: Generate TypeScript API types from OpenAPI
    cmds:
      - npm run generate:api --prefix web

  web-ci:
    desc: Generate, type-check, test, and build the frontend
    cmds:
      - npm ci --prefix web
      - npm run generate:api --prefix web
      - git diff --exit-code -- web/src/api/schema.d.ts
      - npm run check --prefix web
      - npm test --prefix web
      - npm run build --prefix web

  bootstrap:
    desc: Migrate and load the corpus when PostgreSQL is empty
    cmds:
      - go run ./cmd/grocery-router bootstrap {{.CLI_ARGS}}

  migrate:
    desc: Apply database migrations (pass CLI flags after --)
    cmds:
      - go run ./cmd/grocery-router migrate {{.CLI_ARGS}}

  serve:
    desc: Start the local JSON API (pass CLI flags after --)
    cmds:
      - go run ./cmd/grocery-router serve {{.CLI_ARGS}}

  trueup-inventory:
    desc: Validate the PDF recipe inventory (pass CLI flags after --)
    cmds:
      - go run ./cmd/grocery-router trueup-inventory {{.CLI_ARGS}}

  corpus-render:
    desc: Refresh checked human-readable recipe sections (pass CLI flags after --)
    cmds:
      - go run ./cmd/grocery-router corpus-render {{.CLI_ARGS}}

  corpus-audit:
    desc: Validate the approved Markdown corpus (pass CLI flags after --)
    cmds:
      - go run ./cmd/grocery-router corpus-audit {{.CLI_ARGS}}

  corpus-ingest:
    desc: Migrate and ingest the approved corpus (pass CLI flags after --)
    cmds:
      - go run ./cmd/grocery-router corpus-ingest {{.CLI_ARGS}}

  catalog-agent-inputs:
    desc: Build compact ignored inputs for bounded Pi recipe standardization
    cmds:
      - go run ./cmd/grocery-router catalog-agent-inputs {{.CLI_ARGS}}

  catalog-amplify:
    desc: Run isolated low-cost Pi workers over at most 25 catalog inputs
    cmds:
      - bash scripts/catalog-amplify.sh {{.CLI_ARGS}}

  catalog-candidate-build:
    desc: Validate Pi proposals and render Git-reviewable catalog candidates
    cmds:
      - go run ./cmd/grocery-router catalog-candidate-build {{.CLI_ARGS}}

  catalog-audit:
    desc: Audit a catalog release and all committed artifact digests
    cmds:
      - go run ./cmd/grocery-router catalog-audit {{.CLI_ARGS}}

  catalog-publish:
    desc: Transactionally publish a catalog review release to PostgreSQL
    cmds:
      - go run ./cmd/grocery-router catalog-publish {{.CLI_ARGS}}

  recipe-source-pilot:
    desc: Fetch manifested public recipe JSON-LD into inspectable local output
    cmds:
      - go run ./cmd/grocery-router recipe-source-pilot {{.CLI_ARGS}}

  recipe-intelligence-pilot:
    desc: Assess fetched and approved recipes with the import-time Jev catalog
    cmds:
      - go run ./cmd/grocery-router recipe-intelligence-pilot {{.CLI_ARGS}}
