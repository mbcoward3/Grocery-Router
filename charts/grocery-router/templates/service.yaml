apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: grocery-router
    app.kubernetes.io/instance: {{ .Values.instance | quote }}
spec:
  selector:
    app.kubernetes.io/name: grocery-router
    app.kubernetes.io/instance: {{ .Values.instance | quote }}
  ports:
    - name: http
      port: 80
      targetPort: http
