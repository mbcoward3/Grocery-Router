name: Container and Helm release

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

# Serialize main promotion so an older build cannot move latest after a newer one.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: grocery_router_test
          POSTGRES_USER: grocery_router
          POSTGRES_PASSWORD: grocery_router
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grocery_router -d grocery_router_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      GROCERY_ROUTER_TEST_DATABASE_URL: postgres://grocery_router:grocery_router@localhost:5432/grocery_router_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v4.3.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML==6.0.3
      - run: go test ./...
      - run: npm ci && npm test && npm run build
        working-directory: web
      - run: python3 tools/test_chart.py
      - run: python3 -m unittest discover -s tools -p 'test_update_dev_image.py'

  publish:
    needs: validate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: azure/setup-helm@v4.3.0
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          version: v4.3.1
      - uses: sigstore/cosign-installer@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          cosign-release: v2.6.1
      - uses: imjasonh/setup-crane@v0.4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          version: v0.22.1

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mbcoward3/grocery-router:sha-${{ github.event.pull_request.head.sha || github.sha }}
            ${{ (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') && 'ghcr.io/mbcoward3/grocery-router:latest' || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Sign image, package and sign chart, then promote latest
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          image=ghcr.io/mbcoward3/grocery-router
          chart=ghcr.io/mbcoward3/charts/grocery-router
          version="0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/container.yml@refs/heads/main"
          issuer=https://token.actions.githubusercontent.com

          cosign sign --yes "$image@$IMAGE_DIGEST"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" "$image@$IMAGE_DIGEST" >/dev/null

          mkdir -p build/chart build/packages
          cp -R charts/grocery-router build/chart/grocery-router
          python3 - "$IMAGE_DIGEST" <<'PY'
          import pathlib, re, sys
          digest = sys.argv[1]
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
              raise SystemExit('invalid build digest')
          path = pathlib.Path('build/chart/grocery-router/values.yaml')
          text, count = re.subn(r'(?m)^  digest: ""$', f'  digest: "{digest}"', path.read_text())
          if count != 1:
              raise SystemExit('expected one digest placeholder')
          path.write_text(text)
          PY
          helm lint build/chart/grocery-router --strict
          helm package build/chart/grocery-router --destination build/packages \
            --version "$version" --app-version "$GITHUB_SHA"
          printf '%s' "$GH_TOKEN" | helm registry login ghcr.io \
            --username "$GITHUB_ACTOR" --password-stdin
          helm push "build/packages/grocery-router-$version.tgz" oci://ghcr.io/mbcoward3/charts
          digest=$(crane digest "$chart:$version")
          cosign sign --yes "$chart@$digest"
          cosign verify --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" "$chart@$digest" >/dev/null
          crane tag "$chart@$digest" latest
          # shellcheck disable=SC2016
          printf '### Published\n- Image: `%s@%s`\n- Chart: `%s:%s`\n- Chart digest: `%s`\n- Promoted chart tag: `latest`\n' \
            "$image" "$IMAGE_DIGEST" "$chart" "$version" "$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy-dev:
    needs: publish
    # Fork PRs cannot publish or access the GitOps deploy key.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: grocery-router-shared-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitOps deploy key
        env:
          DEPLOY_KEY: ${{ secrets.GITOPS_DEPLOY_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/grocery-router-gitops
          chmod 0600 ~/.ssh/grocery-router-gitops
          ssh-keyscan -H github.com > ~/.ssh/known_hosts

      - name: Promote successful build to shared development
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.image-digest }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_SSH_COMMAND: ssh -i ~/.ssh/grocery-router-gitops -o IdentitiesOnly=yes
        run: |
          set -euo pipefail
          git clone git@github.com:mbcoward3/homelab.git gitops
          git -C gitops config user.name 'grocery-router-dev-bot'
          git -C gitops config user.email 'grocery-router-dev-bot@users.noreply.github.com'
          path=apps/grocery-router/dev/release.yaml
          # Retry from current GitOps main if another application pushed meanwhile.
          for attempt in 1 2 3 4 5; do
            git -C gitops fetch origin main
            git -C gitops reset --hard origin/main
            python3 tools/update_dev_image.py "gitops/$path" "$IMAGE_DIGEST"
            if git -C gitops diff --quiet -- "$path"; then
              echo 'Development already uses this image'
              exit 0
            fi
            git -C gitops add "$path"
            git -C gitops commit -m "chore: deploy Grocery Router dev ${SOURCE_SHA:0:12}"
            if git -C gitops push origin HEAD:main; then
              # shellcheck disable=SC2016
              printf '### Development promotion requested\n- URL: https://groceries-dev.matthewcoward.com\n- Commit: `%s`\n- Image: `ghcr.io/mbcoward3/grocery-router@%s`\n\nFlux will reconcile the GitOps commit.\n' \
                "$SOURCE_SHA" "$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep "$attempt"
          done
          echo 'Failed to update shared development after five attempts' >&2
          exit 1
