name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: grocery_router_test
          POSTGRES_USER: grocery_router
          POSTGRES_PASSWORD: grocery_router
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U grocery_router -d grocery_router_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      GROCERY_ROUTER_TEST_DATABASE_URL: postgres://grocery_router:grocery_router@localhost:5432/grocery_router_test?sslmode=disable
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.3"
          enable-cache: true

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.49.1

      - name: Lint and test
        run: task ci
