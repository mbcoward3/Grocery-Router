name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      space:
        description: "Space to deploy to (user/name)"
        required: false

# Deploys the static build to a Hugging Face Space.
#
# Static Spaces are the only free ones - Docker Spaces need PRO, which is what
# stopped the first attempt (docs/deploy.md). So the page runs the real Python
# in the browser under Pyodide rather than on a server. Same code, no port.
#
# Needs one repository secret: HF_TOKEN, a fine-grained token with write access
# to the Space. Settings -> Secrets and variables -> Actions.

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: demo
      url: ${{ steps.push.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests must pass before anything ships
        run: |
          python3 test_pantry.py
          python3 test_shop.py
          python3 test_onboard.py
          python3 test_planner.py
          python3 test_acquire.py
          python3 test_adapters.py
          python3 test_review.py

      - name: Build
        run: python3 build_static.py

      - name: Check it actually runs in a browser
        # "It built" is not "it runs". The fetch shim routes the page's API
        # calls into Python, and it can break without the build failing - the
        # symptom is a blank page on a public URL, not a red build.
        run: |
          pip install --quiet playwright
          python3 -m playwright install --with-deps chromium
          python3 smoke_static.py

      - name: Push to the Space
        id: push
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE: ${{ github.event.inputs.space || vars.HF_SPACE }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$SPACE" ]; then
            echo "::error::No target. Set an HF_SPACE repository variable, e.g. MattCow/pantry-router."
            exit 1
          fi

          code=$(curl -sS -o /tmp/create.json -w '%{http_code}' \
            -X POST https://huggingface.co/api/repos/create \
            -H "Authorization: Bearer $HF_TOKEN" -H 'Content-Type: application/json' \
            -d "{\"name\":\"${SPACE#*/}\",\"organization\":\"${SPACE%/*}\",\"type\":\"space\",\"sdk\":\"static\"}")
          case "$code" in
            200|201) echo "created $SPACE" ;;
            409)     echo "$SPACE already exists" ;;
            *)       echo "::error::create failed (HTTP $code)"; cat /tmp/create.json; exit 1 ;;
          esac

          cd dist
          cat > README.md <<'YAML'
          ---
          title: Pantry Router
          emoji: 🧺
          colorFrom: yellow
          colorTo: red
          sdk: static
          app_file: index.html
          pinned: false
          ---

          The weekly meal-planning session, running entirely in your browser.

          Python compiled to WebAssembly, so this is the same `pantry.py` and
          `shop.py` the real tool runs — not a reimplementation. The household is
          invented; the recipes are real. Nothing you do here is saved anywhere.

          Source: https://github.com/mbcoward3/Grocery-Router
          YAML
          git init -q -b main
          git add -A
          git -c user.email=deploy@local -c user.name=deploy commit -qm "${GITHUB_SHA::7}"
          git push -q --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${SPACE}" main
          echo "url=https://huggingface.co/spaces/${SPACE}" >> "$GITHUB_OUTPUT"
          echo "deployed → https://huggingface.co/spaces/${SPACE}"
