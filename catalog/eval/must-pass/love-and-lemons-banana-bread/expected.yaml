draft_note: >-
  Drafted by a coding agent from the recipe-intelligence pilot candidate; not yet reviewed by the
  household. Check: (1) line 2 "½ cup melted butter or vegetable oil (plus more for the pan)" is
  both an alternative and a "plus more" line; catalog format v1 allows one relationship per line,
  so it is drafted as additive (½ cup melted butter + unspecified butter for the pan) with the
  vegetable-oil option kept as a note. Decide whether that is right or whether this line should
  reject until the format can say both. (2) line 10 walnuts are additive: ½ cup chopped plus 2 tbsp
  chopped for topping, aggregating to 5/8 cup on the list. (3) line 1 "cane sugar or brown sugar"
  takes cane sugar as a coherent first alternative (the steps only say "sugar"). (4) bananas are
  2 cups mashed (measured), with "about 4 large" kept as a note, not converted to a count.
  (5) sea salt maps to the single presence-only salt item (spec §11 default), so the list shows
  "salt" with no amount. (6) cinnamon and nutmeg stay unqualified (the source does not say ground).
  (7) The source node is reconstructed from the pilot candidate, not stored evidence.
outcome: publish
